name: Camera Dependency Generator

on:
  push:
    branches:
      - agent/ean-camera-scanner
    paths:
      - '.github/workflows/camera-deps-generator.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned camera dependencies
        working-directory: web
        run: npm install --save-exact @zxing/browser@0.2.1 @zxing/library@0.23.0

      - name: Validate generated dependency tree
        working-directory: web
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high

      - name: Commit generated package files
        shell: bash
        run: |
          if git diff --quiet -- web/package.json web/package-lock.json; then
            echo 'No package changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package.json web/package-lock.json
          git commit -m 'build(web): add pinned barcode scanner dependencies'
          git push
