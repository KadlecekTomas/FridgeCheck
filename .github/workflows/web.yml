name: Web CI

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=critical

  prune-legacy-dependencies:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/dependency-auth-cleanup'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install current lockfile
        working-directory: web
        run: npm ci

      - name: Remove unreachable legacy packages
        working-directory: web
        run: |
          npm uninstall \
            @fullpage/react-fullpage \
            @heroicons/react \
            @supabase/auth-helpers-nextjs \
            @zxing/browser \
            axios \
            clsx \
            date-fns \
            formik \
            framer-motion \
            fullpage.js \
            html5-qrcode \
            jsqr \
            qrcode \
            react-icons \
            react-qr-barcode-scanner \
            react-qr-reader \
            react-spinners \
            react-toastify \
            tesseract.js \
            yup
          npm uninstall --save-dev @types/fullpage.js @types/qrcode
          npm audit fix --audit-level=critical

      - name: Validate generated dependency tree
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=critical

      - name: Commit generated package files
        shell: bash
        run: |
          if git diff --quiet -- web/package.json web/package-lock.json; then
            echo 'No package changes generated.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package.json web/package-lock.json
          git commit -m 'chore(web): prune legacy dependencies'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
