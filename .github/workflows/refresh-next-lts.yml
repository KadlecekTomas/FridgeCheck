name: Refresh Next LTS lockfile

on:
  push:
    branches:
      - agent/v2-app-shell-dashboard
    paths:
      - '.github/workflows/refresh-next-lts.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/v2-app-shell-dashboard

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Upgrade supported framework line
        working-directory: web
        run: |
          npm install --save-exact next@15.5.21 react@19.2.8 react-dom@19.2.8
          npm install --save-dev --save-exact eslint-config-next@15.5.21 @types/react@19.2.18 @types/react-dom@19.2.4

      - name: Require no critical npm advisories
        working-directory: web
        run: npm audit --audit-level=critical

      - name: Commit generated dependency lock
        shell: bash
        run: |
          if git diff --quiet -- web/package.json web/package-lock.json; then
            echo 'No dependency changes generated.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package.json web/package-lock.json
          git commit -m 'chore(web): upgrade supported Next.js LTS'
          git push origin HEAD:agent/v2-app-shell-dashboard
