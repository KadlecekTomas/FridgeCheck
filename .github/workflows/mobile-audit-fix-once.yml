name: Mobile audit fix (one-shot)

on:
  push:
    branches:
      - security/mobile-audit-gate
    paths:
      - '.github/workflows/mobile-audit-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          ref: security/mobile-audit-gate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install current graph
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Apply compatible npm audit fixes to lockfile
        working-directory: mobile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Prove package manifest was not changed
        run: git diff --exit-code -- mobile/package.json

      - name: Validate refreshed graph
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run typecheck
          npx --no-install expo install --check
          npm audit --audit-level=low || true

      - name: Commit compatible audit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m 'security(mobile): apply compatible npm audit fixes'
          git push origin HEAD:security/mobile-audit-gate
