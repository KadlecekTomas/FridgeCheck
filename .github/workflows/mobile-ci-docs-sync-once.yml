name: Mobile CI docs sync (one-shot)

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-ci-docs-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: security/mobile-audit-gate
          fetch-depth: 0

      - name: Update CI contract
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('docs/CI_CD.md')
          text = path.read_text()

          replacements = {
              "- lockfile dependency installation with `npm ci`,\n- a supported Node.js 22 runtime compatible with the current Expo SDK,\n- ESLint,\n- explicit strict TypeScript type checking,\n- `expo install --check` so dependency updates cannot silently leave Expo/React Native package versions out of alignment.\n\nThis gate validates the current native foundation; it does not claim App Store / Google Play release readiness. As native gains product-critical flows, native build, device/E2E and release validation must be added deliberately rather than inferred from lint/typecheck or web coverage.":
              "- lockfile dependency installation with `npm ci`,\n- a supported Node.js 22 runtime compatible with the current Expo SDK,\n- a blocking `npm audit --audit-level=high` dependency gate,\n- ESLint,\n- explicit strict TypeScript type checking,\n- `expo install --check` so dependency updates cannot silently leave Expo/React Native package versions out of alignment,\n- production JavaScript bundle exports for both Android and iOS.\n\nThis gate validates dependency security, static quality, SDK alignment and production bundling for the current native foundation. The bundle exports are not signed native binaries and do not prove device behavior or App Store / Google Play release readiness. Native binary build, device/E2E and release validation must be added deliberately before native becomes release-bearing.",
              "The current Expo SDK 53 native foundation is validated on Node.js 22.13.0 rather than its obsolete historical Node.js 18 CI runtime.":
              "The current Expo SDK 57 / React Native 0.86 native foundation is validated on Node.js 22.13.0. The coordinated SDK migration is protected by Expo dependency-alignment checks, HIGH-or-higher dependency auditing and Android/iOS production bundle exports.",
              "The current web pipeline blocks HIGH-or-higher npm advisories, Dependency Review blocks newly introduced HIGH/CRITICAL dependency vulnerabilities in pull requests, and Gitleaks scans repository history for secrets.":
              "The current web and mobile pipelines block HIGH-or-higher npm advisories, Dependency Review blocks newly introduced HIGH/CRITICAL dependency vulnerabilities in pull requests, and Gitleaks scans repository history for secrets.",
              "The current mobile gate is a foundation, not the final native pipeline.\n\nBefore native release readiness is claimed, add validation appropriate to the product surface, including:\n\n1. deterministic dependency install,\n2. lint and strict typecheck,\n3. Expo dependency alignment,\n4. unit/contract tests for native-specific code,\n5. reproducible Android/iOS build validation,":
              "The current mobile gate is a foundation, not the final native pipeline. It already enforces deterministic dependency installation, HIGH-or-higher dependency auditing, lint, strict typecheck, Expo dependency alignment and Android/iOS production JavaScript bundle exports.\n\nBefore native release readiness is claimed, add the remaining validation appropriate to the product surface, including:\n\n1. unit/contract tests for native-specific code,\n2. reproducible signed Android/iOS native binary build validation,",
              "6. device or simulator E2E for critical native journeys,\n7. barcode/camera permission and fallback coverage,\n8. push/deep-link coverage when those capabilities are introduced,\n9. offline/reconciliation tests if offline state becomes authoritative,\n10. signed release/store pipeline validation.":
              "3. device or simulator E2E for critical native journeys,\n4. barcode/camera permission and fallback coverage,\n5. push/deep-link coverage when those capabilities are introduced,\n6. offline/reconciliation tests if offline state becomes authoritative,\n7. signed release/store pipeline validation."
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected CI contract text not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- docs/CI_CD.md

      - name: Commit CI contract update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CI_CD.md
          git diff --cached --exit-code && exit 0
          git commit -m 'docs(ci): document Expo 57 mobile security gate'
          git pull --rebase origin security/mobile-audit-gate
          git push origin HEAD:security/mobile-audit-gate
