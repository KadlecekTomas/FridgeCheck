name: Mobile transitive hardening (one-shot)

on:
  push:
    branches:
      - security/mobile-transitive-hardening
    paths:
      - '.github/workflows/mobile-hardening-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: security/mobile-transitive-hardening

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install current graph
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Audit current graph
        working-directory: mobile
        run: npm audit --audit-level=low || true

      - name: Refresh targeted vulnerable transitive dependencies
        working-directory: mobile
        run: npm update --package-lock-only --ignore-scripts js-yaml brace-expansion shell-quote

      - name: Prove package manifest was not changed
        run: git diff --exit-code -- mobile/package.json

      - name: Validate refreshed graph
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run typecheck
          npx --no-install expo install --check
          npm audit --audit-level=low || true

      - name: Commit targeted lockfile refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m 'security(mobile): refresh vulnerable transitive dependencies'
          git push origin HEAD:security/mobile-transitive-hardening
