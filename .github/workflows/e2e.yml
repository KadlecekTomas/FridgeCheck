name: Core E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'supabase/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: core-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  household-inventory-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant pull-request changes
        id: relevance
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/core-e2e-changed-files.txt
          if grep -Eq '^(web/|supabase/|\.github/workflows/e2e\.yml$)' /tmp/core-e2e-changed-files.txt; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: github.event_name != 'pull_request' || steps.relevance.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: github.event_name != 'pull_request' || steps.relevance.outputs.run == 'true'
        working-directory: web
        run: npm ci

      - name: Install pinned Playwright runner
        if: github.event_name != 'pull_request' || steps.relevance.outputs.run == 'true'
        working-directory: web
        run: npm install --no-save --package-lock=false @playwright/test@1.61.1

      - name: Install Chromium
        if: github.event_name != 'pull_request' || steps.relevance.outputs.run == 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        if: github.event_name != 'pull_request' || steps.relevance.outputs.run == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Start clean local Supabase
        if: github.event_name != 'pull_request' || steps.relevance.outputs.run == 'true'
        run: |
          supabase start
          supabase db reset

      - name: Export local browser credentials
        if: github.event_name != 'pull_request' || steps.relevance.outputs.run == 'true'
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Build production Next.js app
        if: github.event_name != 'pull_request' || steps.relevance.outputs.run == 'true'
        working-directory: web
        run: npm run build

      - name: Start production Next.js app
        if: github.event_name != 'pull_request' || steps.relevance.outputs.run == 'true'
        shell: bash
        run: |
          cd web
          npm run start -- --hostname 127.0.0.1 > /tmp/fridgecheck-next.log 2>&1 &
          echo $! > /tmp/fridgecheck-next.pid

          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/register > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/fridgecheck-next.log
          exit 1

      - name: Run production browser E2E suite
        if: github.event_name != 'pull_request' || steps.relevance.outputs.run == 'true'
        working-directory: web
        run: npx playwright test --reporter=line

      - name: Upload UI review previews
        if: success() && (github.event_name != 'pull_request' || steps.relevance.outputs.run == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: fridgecheck-ui-review
          path: |
            web/test-results/landing-page-*.png
            web/test-results/ui-audit-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload real marketing screenshots
        if: always() && (github.event_name != 'pull_request' || steps.relevance.outputs.run == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: fridgecheck-marketing-screenshots
          path: web/marketing-screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload E2E failure artifacts
        if: failure() && (github.event_name != 'pull_request' || steps.relevance.outputs.run == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: fridgecheck-e2e-failure
          path: |
            web/test-results
            /tmp/fridgecheck-next.log
          if-no-files-found: ignore

      - name: Stop services
        if: always() && (github.event_name != 'pull_request' || steps.relevance.outputs.run == 'true')
        shell: bash
        run: |
          if [ -f /tmp/fridgecheck-next.pid ]; then
            kill "$(cat /tmp/fridgecheck-next.pid)" || true
          fi
          supabase stop --no-backup || true
