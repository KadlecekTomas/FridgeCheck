name: Approximate quantity client integration (one-shot)

on:
  push:
    branches:
      - feat/approximate-quantity
    paths:
      - '.github/workflows/approximate-quantity-ui-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/approximate-quantity
          fetch-depth: 0

      - name: Finish estimate-aware client surfaces
        run: |
          python3 <<'PY'
          from pathlib import Path

          def ensure_replace(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_str}: expected one old match or existing new text; got {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1))

          # Amount entry can be marked as an estimate. Package entry remains exact.
          p = 'web/src/app/(auth)/inventory/new/page.tsx'
          ensure_replace(p,
              "  const [quantity, setQuantity] = useState('1')\n  const [unit, setUnit] = useState<InventoryUnit>('pcs')",
              "  const [quantity, setQuantity] = useState('1')\n  const [quantityIsEstimate, setQuantityIsEstimate] = useState(false)\n  const [unit, setUnit] = useState<InventoryUnit>('pcs')")
          ensure_replace(p,
              "    setQuantity('1')\n    setUnit('pcs')\n    setPackageCount('1')",
              "    setQuantity('1')\n    setQuantityIsEstimate(false)\n    setUnit('pcs')\n    setPackageCount('1')")
          ensure_replace(p,
              "    setPackageCount('1')\n    setQuantity('1')\n    resetExpirySplit()",
              "    setPackageCount('1')\n    setQuantity('1')\n    setQuantityIsEstimate(false)\n    resetExpirySplit()")
          ensure_replace(p,
              "        setPackageCount('1')\n      }\n\n      setLookupStatus(",
              "        setPackageCount('1')\n        setQuantityIsEstimate(false)\n      }\n\n      setLookupStatus(")
          ensure_replace(p,
              "                  setPackageCount('1')\n                  setQuantity('1')\n                  resetExpirySplit()",
              "                  setPackageCount('1')\n                  setQuantity('1')\n                  setQuantityIsEstimate(false)\n                  resetExpirySplit()")
          ensure_replace(p,
              "              p_quantity: quantityValue,\n              p_unit: selectedProduct.default_unit,\n              ...expiryArgs,",
              "              p_quantity: quantityValue,\n              p_unit: selectedProduct.default_unit,\n              p_quantity_is_estimate: quantityIsEstimate,\n              ...expiryArgs,")
          ensure_replace(p,
              "            p_quantity: quantityValue,\n            p_unit: resolvedUnit,\n            p_brand:",
              "            p_quantity: quantityValue,\n            p_unit: resolvedUnit,\n            p_quantity_is_estimate: quantityIsEstimate,\n            p_brand:")
          ensure_replace(p,
              "                    setEntryMode('amount')\n                    setUnit(packageUnit)\n                    setQuantity('1')\n                    resetExpirySplit()",
              "                    setEntryMode('amount')\n                    setUnit(packageUnit)\n                    setQuantity('1')\n                    setQuantityIsEstimate(false)\n                    resetExpirySplit()")
          ensure_replace(p,
              "                    setEntryMode('packages')\n                    setPackageUnit(unit)\n                    setPackageQuantity('1')",
              "                    setEntryMode('packages')\n                    setQuantityIsEstimate(false)\n                    setPackageUnit(unit)\n                    setPackageQuantity('1')")
          ensure_replace(p,
              "          <label className=\"block\">\n            <span className=\"field-label\">Kam to dáváš?</span>",
              "          {!usesPackages ? (\n            <label className=\"flex cursor-pointer items-start gap-3 rounded-2xl border border-border bg-canvas/60 p-4\">\n              <input\n                type=\"checkbox\"\n                checked={quantityIsEstimate}\n                onChange={(event) => setQuantityIsEstimate(event.target.checked)}\n                className=\"mt-0.5 h-5 w-5 rounded border-border accent-primary\"\n              />\n              <span className=\"min-w-0\">\n                <span className=\"block text-sm font-semibold text-text\">Množství je jen odhad</span>\n                <span className=\"mt-0.5 block text-xs leading-5 text-text-muted\">Například ~150 g. Číslo dál používáme pro výpočty, ale nepředstíráme větší přesnost.</span>\n              </span>\n            </label>\n          ) : null}\n\n          <label className=\"block\">\n            <span className=\"field-label\">Kam to dáváš?</span>")

          # Inventory aggregate and batch rows preserve estimate semantics.
          p = 'web/src/app/(auth)/inventory/page.tsx'
          old = """            const currentQuantity = dashboard.batches
              .filter(
                (batch) =>
                  batch.product_id === product.id &&
                  batch.unit === product.default_unit &&
                  isBatchUsableForStock({
                    id: batch.id,
                    productId: batch.product_id,
                    quantity: batch.quantity,
                    unit: batch.unit,
                    expiryDate: batch.expiry_date,
                    expiryType: batch.expiry_type,
                    status: batch.status,
                  })
              )
              .reduce((sum, batch) => sum + batch.quantity, 0)
"""
          new = """            const usableBatches = dashboard.batches.filter(
              (batch) =>
                batch.product_id === product.id &&
                batch.unit === product.default_unit &&
                isBatchUsableForStock({
                  id: batch.id,
                  productId: batch.product_id,
                  quantity: batch.quantity,
                  quantityIsEstimate: batch.quantity_is_estimate,
                  unit: batch.unit,
                  expiryDate: batch.expiry_date,
                  expiryType: batch.expiry_type,
                  status: batch.status,
                })
            )
            const currentQuantity = usableBatches.reduce((sum, batch) => sum + batch.quantity, 0)
            const currentQuantityIsEstimate = usableBatches.some((batch) => batch.quantity_is_estimate)
"""
          ensure_replace(p, old, new)
          ensure_replace(p,
              'Doma {formatStockQuantity(currentQuantity, product.default_unit, product.package_quantity, product.package_unit)}',
              'Doma {formatStockQuantity(currentQuantity, product.default_unit, product.package_quantity, product.package_unit, currentQuantityIsEstimate)}')
          ensure_replace(p,
              '                      packageUnit={product.package_unit}\n                      onConsumed={dashboard.refresh}',
              '                      packageUnit={product.package_unit}\n                      availableQuantityIsEstimate={currentQuantityIsEstimate}\n                      onConsumed={dashboard.refresh}')
          ensure_replace(p,
              '{formatStockQuantity(batch.quantity, batch.unit, product.package_quantity, product.package_unit)}',
              '{formatStockQuantity(batch.quantity, batch.unit, product.package_quantity, product.package_unit, batch.quantity_is_estimate)}')
          ensure_replace(p,
              '                                  quantity={batch.quantity}\n                                  unit={batch.unit}\n                                  packageQuantity={product.package_quantity}\n                                  packageUnit={product.package_unit}\n                                  onCorrected=',
              '                                  quantity={batch.quantity}\n                                  quantityIsEstimate={batch.quantity_is_estimate}\n                                  unit={batch.unit}\n                                  packageQuantity={product.package_quantity}\n                                  packageUnit={product.package_unit}\n                                  onCorrected=')
          ensure_replace(p,
              '                                  quantity={batch.quantity}\n                                  unit={batch.unit}\n                                  packageQuantity={product.package_quantity}\n                                  packageUnit={product.package_unit}\n                                  onDiscarded=',
              '                                  quantity={batch.quantity}\n                                  quantityIsEstimate={batch.quantity_is_estimate}\n                                  unit={batch.unit}\n                                  packageQuantity={product.package_quantity}\n                                  packageUnit={product.package_unit}\n                                  onDiscarded=')

          # Consume/discard dialogs render estimated available stock truthfully.
          p = 'web/src/components/app/ConsumeProductAction.tsx'
          ensure_replace(p, '  availableQuantity,\n  packageQuantity = null,', '  availableQuantity,\n  availableQuantityIsEstimate = false,\n  packageQuantity = null,')
          ensure_replace(p, '  availableQuantity: number\n  packageQuantity?:', '  availableQuantity: number\n  availableQuantityIsEstimate?: boolean\n  packageQuantity?:')
          ensure_replace(p,
              '`Použitelně je doma jen ${formatQuantity(availableQuantity, unit)}.`',
              '`Použitelně je doma jen ${formatQuantity(availableQuantity, unit, availableQuantityIsEstimate)}.`')
          ensure_replace(p,
              '`Spotřebováno ${usesPackages ? formatPackageCount(enteredValue) : formatQuantity(storedValue, unit)} · ${productName}`',
              '`Spotřebováno ${usesPackages ? formatPackageCount(enteredValue) : formatQuantity(storedValue, unit, availableQuantityIsEstimate)} · ${productName}`')
          ensure_replace(p,
              '{formatStockQuantity(availableQuantity, unit, packageQuantity, packageUnit)}',
              '{formatStockQuantity(availableQuantity, unit, packageQuantity, packageUnit, availableQuantityIsEstimate)}')

          p = 'web/src/components/app/DiscardBatchAction.tsx'
          ensure_replace(p, '  quantity: availableQuantity,\n  unit,', '  quantity: availableQuantity,\n  quantityIsEstimate = false,\n  unit,')
          ensure_replace(p, '  quantity: number\n  unit: string', '  quantity: number\n  quantityIsEstimate?: boolean\n  unit: string')
          ensure_replace(p,
              '`V této zásobě je jen ${formatQuantity(availableQuantity, unit)}.`',
              '`V této zásobě je jen ${formatQuantity(availableQuantity, unit, quantityIsEstimate)}.`')
          ensure_replace(p,
              '`Vyřazeno ${usesPackages ? formatPackageCount(enteredValue) : formatQuantity(storedValue, unit)} · ${productName}`',
              '`Vyřazeno ${usesPackages ? formatPackageCount(enteredValue) : formatQuantity(storedValue, unit, quantityIsEstimate)} · ${productName}`')
          ensure_replace(p,
              '{formatStockQuantity(availableQuantity, unit, packageQuantity, packageUnit)}',
              '{formatStockQuantity(availableQuantity, unit, packageQuantity, packageUnit, quantityIsEstimate)}')

          # Dashboard carries uncertainty from usable batches into current stock and recommendations.
          p = 'web/src/app/(auth)/dashboard/page.tsx'
          ensure_replace(p, '      quantity: batch.quantity,\n      unit: batch.unit,', '      quantity: batch.quantity,\n      quantityIsEstimate: batch.quantity_is_estimate,\n      unit: batch.unit,')
          ensure_replace(p,
              '  const urgentConsumeBatchIds = useMemo(() => {',
              """  const usableEstimateByProduct = useMemo(() => {
    const now = new Date()
    return new Map(
      dashboard.products.map((product) => [
        product.id,
        domainBatches.some((batch) =>
          batch.productId === product.id &&
          batch.unit === product.default_unit &&
          batch.quantityIsEstimate === true &&
          isBatchUsableForStock(batch, now)
        ),
      ])
    )
  }, [dashboard.products, domainBatches])

  const urgentConsumeBatchIds = useMemo(() => {""")
          ensure_replace(p,
              '{formatStockQuantity(batch.quantity, batch.unit, product?.package_quantity, product?.package_unit)}',
              '{formatStockQuantity(batch.quantity, batch.unit, product?.package_quantity, product?.package_unit, batch.quantityIsEstimate === true)}')
          ensure_replace(p,
              '                            availableQuantity={availableQuantity}\n                            packageQuantity=',
              '                            availableQuantity={availableQuantity}\n                            availableQuantityIsEstimate={usableEstimateByProduct.get(product.id) ?? false}\n                            packageQuantity=')
          ensure_replace(p,
              'Doma {formatStockQuantity(item.currentQuantity, item.unit, product?.package_quantity, product?.package_unit)} · chci',
              'Doma {formatStockQuantity(item.currentQuantity, item.unit, product?.package_quantity, product?.package_unit, item.currentQuantityIsEstimate)} · chci')
          ensure_replace(p,
              'koupit {formatStockQuantity(purchaseQuantity, item.unit, product?.package_quantity, product?.package_unit)}',
              'koupit {formatStockQuantity(purchaseQuantity, item.unit, product?.package_quantity, product?.package_unit, item.currentQuantityIsEstimate)}')

          # Shopping recommendations retain the estimate marker until a concrete list decision is made.
          p = 'web/src/app/(auth)/shopping/page.tsx'
          ensure_replace(p, '      quantity: batch.quantity,\n      unit: batch.unit,', '      quantity: batch.quantity,\n      quantityIsEstimate: batch.quantity_is_estimate,\n      unit: batch.unit,')
          ensure_replace(p,
              'Doma {formatStockQuantity(item.currentQuantity, item.unit, product.package_quantity, product.package_unit)} · chci',
              'Doma {formatStockQuantity(item.currentQuantity, item.unit, product.package_quantity, product.package_unit, item.currentQuantityIsEstimate)} · chci')
          ensure_replace(p,
              'formatStockQuantity(purchaseQuantity, item.unit, product.package_quantity, product.package_unit)}`}',
              'formatStockQuantity(purchaseQuantity, item.unit, product.package_quantity, product.package_unit, item.currentQuantityIsEstimate)}`}')
          ensure_replace(p,
              "formatStockQuantity(purchaseQuantity, item.unit, product.package_quantity, product.package_unit)}",
              "formatStockQuantity(purchaseQuantity, item.unit, product.package_quantity, product.package_unit, item.currentQuantityIsEstimate)}")

          # History renders event provenance.
          p = 'web/src/domain/inventory/history.ts'
          ensure_replace(p,
              'export function formatInventoryEventQuantity(delta: number | null, unit: string | null) {',
              'export function formatInventoryEventQuantity(delta: number | null, unit: string | null, isEstimate = false) {')
          ensure_replace(p,
              '  return `${sign}${numberFormatter.format(Math.abs(delta))} ${normalizedUnit}`',
              "  return `${sign}${isEstimate ? '~' : ''}${numberFormatter.format(Math.abs(delta))} ${normalizedUnit}`")

          p = 'web/src/app/(auth)/history/page.tsx'
          ensure_replace(p,
              "  product: Tables<'products'> | undefined\n) {",
              "  product: Tables<'products'> | undefined,\n  isEstimate: boolean\n) {")
          ensure_replace(p, '      return `${sign}${formatPackageCount(packages)}`', '      return `${sign}${formatPackageCount(packages, isEstimate)}`')
          ensure_replace(p, '  return formatInventoryEventQuantity(delta, unit)', '  return formatInventoryEventQuantity(delta, unit, isEstimate)')
          ensure_replace(p,
              'const formattedQuantity = formatEventQuantity(event.quantity_delta, event.unit, product)',
              'const formattedQuantity = formatEventQuantity(event.quantity_delta, event.unit, product, event.quantity_is_estimate)')

          # Contract docs explicitly choose useful numeric estimates over vague states.
          p = 'docs/PRODUCT.md'
          ensure_replace(p,
              'Supported precision should match real life. Some items need exact quantities (`6 eggs`, `800 g chicken`); others may be adequately represented by approximate states (`low`, `half`, `full`).\n\nThe UI must not force false precision.',
              'Supported precision should match real life. Some items need exact quantities (`6 eggs`, `800 g chicken`); others are better recorded as explicit numeric estimates (`~4 eggs`, `~150 g oats`). The estimate marker describes confidence in the number; the canonical numeric value still powers deterministic inventory and shopping arithmetic.\n\nThe UI must not force false precision or hide uncertainty behind vague states when a useful numeric estimate is available.')

          p = 'docs/DATA_MODEL.md'
          ensure_replace(p, '- `quantity`\n- `unit`', '- `quantity`\n- `quantity_is_estimate`\n- `unit`')
          ensure_replace(p,
              'Approximate inventory (`low`, `half`, `full`) may be supported as a separate explicit mode; do not pretend approximate states are precise measurements.',
              'Approximate inventory uses an explicit numeric estimate plus `quantity_is_estimate = true`, for example `~150 g` or `~4 pcs`. The numeric value remains canonical for deterministic arithmetic; the estimate flag must propagate to user-facing stock and derived replenishment so uncertainty is never presented as false precision. Vague states such as `low` / `half` / `full` are not the canonical quantity model.')
          PY

          git diff --check
          git status --short

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web docs
          git diff --cached --exit-code && exit 0
          git commit -m 'feat(inventory): surface approximate quantity semantics'
          git pull --rebase origin feat/approximate-quantity
          git push origin HEAD:feat/approximate-quantity
