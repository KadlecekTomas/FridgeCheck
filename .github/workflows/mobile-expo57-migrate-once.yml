name: Mobile Expo 57 migration (one-shot)

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-expo57-migrate-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: security/mobile-audit-gate
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Reset mobile dependency files to main baseline
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- mobile/package.json mobile/package-lock.json

      - name: Set coordinated Expo 57 dependency versions
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          Object.assign(pkg.dependencies, {
            expo: '~57.0.15',
            'expo-constants': '~57.0.13',
            'expo-status-bar': '~57.0.1',
            react: '19.2.3',
            'react-native': '0.86.2',
          });

          Object.assign(pkg.devDependencies, {
            '@types/react': '~19.2.4',
            typescript: '~6.0.3',
          });

          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Re-resolve dependency graph from clean lockfile state
        working-directory: mobile
        run: |
          rm -rf node_modules package-lock.json
          npm install --ignore-scripts

      - name: Validate migrated dependency graph
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run typecheck
          npx --no-install expo install --check
          npm audit --audit-level=high

      - name: Prove production bundle for Android
        working-directory: mobile
        run: npx --no-install expo export --platform android --output-dir .expo-ci-android

      - name: Prove production bundle for iOS
        working-directory: mobile
        run: npx --no-install expo export --platform ios --output-dir .expo-ci-ios

      - name: Commit coordinated framework migration
        run: |
          rm -rf mobile/.expo-ci-android mobile/.expo-ci-ios
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/package.json mobile/package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m 'security(mobile): migrate to Expo SDK 57'
          git pull --rebase origin security/mobile-audit-gate
          git push origin HEAD:security/mobile-audit-gate
