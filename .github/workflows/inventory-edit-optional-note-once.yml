name: Inventory edit optional note (one-shot)

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/inventory-edit-optional-note-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/inventory-editability-clean
          fetch-depth: 0

      - name: Make audit note optional without losing history
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path_str}: expected exactly one match, got {text.count(old)} for {old[:80]!r}')
              path.write_text(text.replace(old, new, 1))

          migration = 'supabase/migrations/20260823093000_inventory_metadata_edits.sql'
          replace_once(
              migration,
              """  normalized_reason := nullif(trim(p_reason), '');
  if normalized_reason is null then
    raise exception 'Edit reason is required' using errcode = '22023';
  end if;
  if length(normalized_reason) > 500 then
    raise exception 'Reason must be 500 characters or fewer' using errcode = '22023';
  end if;
""",
              """  normalized_reason := nullif(trim(p_reason), '');
  if normalized_reason is not null and length(normalized_reason) > 500 then
    raise exception 'Reason must be 500 characters or fewer' using errcode = '22023';
  end if;
""",
          )
          replace_once(
              migration,
              """      format('%s → %s · %s', old_storage_name, new_storage_name, normalized_reason),
""",
              """      format('%s → %s', old_storage_name, new_storage_name)
        || case when normalized_reason is null then '' else ' · ' || normalized_reason end,
""",
          )
          replace_once(
              migration,
              """      format('%s → %s · %s', old_expiry_label, new_expiry_label, normalized_reason),
""",
              """      format('%s → %s', old_expiry_label, new_expiry_label)
        || case when normalized_reason is null then '' else ' · ' || normalized_reason end,
""",
          )

          sql_test = 'supabase/tests/inventory_metadata_edits.sql'
          replace_once(
              sql_test,
              """  begin
    perform public.update_inventory_batch_details(batch_a, freezer_a, 'unknown', null, '   ');
    raise exception 'Blank edit reason was unexpectedly allowed';
  exception when invalid_parameter_value then null;
  end;

  begin
    perform public.update_inventory_batch_details(batch_a, freezer_a, 'unknown', null, repeat('x', 501));
""",
              """  if public.update_inventory_batch_details(batch_a, freezer_a, 'unknown', null, '   ') <> batch_a then
    raise exception 'Batch edit without a note returned an unexpected batch id';
  end if;

  if not exists (
    select 1 from public.inventory_events
    where inventory_batch_id = batch_a and product_id = product_a and type = 'correction'
      and quantity_delta is null and unit is null
      and reason = 'min. trvanlivost 2026-08-25 → bez data'
      and created_by = 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
  ) then
    raise exception 'Optional-note expiry correction did not retain an automatic audit trail';
  end if;

  select count(*) into event_count
  from public.inventory_events
  where inventory_batch_id = batch_a and type in ('move', 'correction');

  begin
    perform public.update_inventory_batch_details(batch_a, freezer_a, 'unknown', null, repeat('x', 501));
""",
          )
          replace_once(
              sql_test,
              """    select 1 from public.inventory_batches
    where id = batch_a and storage_unit_id = freezer_a and expiry_type = 'best_before' and expiry_date = '2026-08-25'
""",
              """    select 1 from public.inventory_batches
    where id = batch_a and storage_unit_id = freezer_a and expiry_type = 'unknown' and expiry_date is null
""",
          )

          component = 'web/src/components/app/EditBatchDetailsAction.tsx'
          replace_once(
              component,
              """    if (!normalizedReason) {
      setError('Napiš stručně, proč údaje opravuješ.')
      return
    }
    if (normalizedReason.length > 500) {
""",
              """    if (normalizedReason.length > 500) {
""",
          )
          replace_once(
              component,
              """      p_reason: normalizedReason,
""",
              """      p_reason: normalizedReason || undefined,
""",
          )
          replace_once(
              component,
              """              Oprav umístění nebo datum, pokud evidence neodpovídá skutečnosti. Změna se zapíše do historie. Množství upravuj přes „Srovnat stav“.
""",
              """              Oprav umístění nebo datum, pokud evidence neodpovídá skutečnosti. Změna se do historie zapíše automaticky; poznámku přidej jen tehdy, když později pomůže vysvětlit proč. Množství upravuj přes „Srovnat stav“.
""",
          )
          replace_once(
              component,
              """                <label htmlFor={reasonId} className=\"field-label\">Proč údaje měníš?</label>
                <textarea id={reasonId} className=\"input-field min-h-24 resize-y\" value={reason} onChange={(event) => setReason(event.target.value)} maxLength={500} placeholder=\"např. špatně opsané datum, přesunuto do mrazáku\" required />
""",
              """                <label htmlFor={reasonId} className=\"field-label\">Poznámka k opravě <span className=\"font-normal text-text-muted\">(volitelné)</span></label>
                <textarea id={reasonId} className=\"input-field min-h-24 resize-y\" value={reason} onChange={(event) => setReason(event.target.value)} maxLength={500} placeholder=\"např. špatně opsané datum\" />
""",
          )
          replace_once(
              component,
              """                <button type=\"submit\" disabled={submitting || !storageId || !reason.trim() || (expiryType !== 'unknown' && !expiryDate)} className=\"button-primary flex-1\">
""",
              """                <button type=\"submit\" disabled={submitting || !storageId || (expiryType !== 'unknown' && !expiryDate)} className=\"button-primary flex-1\">
""",
          )

          e2e = 'web/e2e/inventory-editability.spec.ts'
          replace_once(
              e2e,
              """  await batchDialog.getByLabel('Proč údaje měníš?').fill('opraven štítek a přesunuto')
""",
              """,
          )
          replace_once(
              e2e,
              """  await expect(moveEvent).toContainText('Lednice → Mrazák · opraven štítek a přesunuto')
""",
              """  await expect(moveEvent).toContainText('Lednice → Mrazák')
""",
          )
          replace_once(
              e2e,
              """    `spotřebujte do ${originalDate} → min. trvanlivost ${correctedDate} · opraven štítek a přesunuto`
""",
              """    `spotřebujte do ${originalDate} → min. trvanlivost ${correctedDate}`
""",
          )
          PY

          git diff --check
          git diff -- supabase/migrations/20260823093000_inventory_metadata_edits.sql supabase/tests/inventory_metadata_edits.sql web/src/components/app/EditBatchDetailsAction.tsx web/e2e/inventory-editability.spec.ts

      - name: Commit low-friction repair flow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260823093000_inventory_metadata_edits.sql supabase/tests/inventory_metadata_edits.sql web/src/components/app/EditBatchDetailsAction.tsx web/e2e/inventory-editability.spec.ts
          git diff --cached --exit-code && exit 0
          git commit -m 'ux(inventory): make repair audit note optional'
          git pull --rebase origin fix/inventory-editability-clean
          git push origin HEAD:fix/inventory-editability-clean
