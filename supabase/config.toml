project_id = "fridgecheck-dev"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback?next=/update-password"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[studio]
enabled = false

# Keep the legacy section name while Supabase hosted config parsing still rejects
# the newer [local_smtp] key. Current CLI accepts this locally with a warning.
[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326
